name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  changeset:
    # Enforce that every PR carries a changeset (hard gate; add it as a required
    # status check in .github/rulesets/main.json). Use `npx changeset --empty`
    # for PRs that intentionally need no release (docs/CI/tests).
    # Not on a Dependabot pull request: Dependabot cannot write a changeset, and
    # its bump reaches the next release anyway (PO-760). The author of the pull
    # request decides, not the actor, so a re-run by a person skips it too.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # fetch-depth: 0 already fetches every branch, main included, so the
          # gate below needs no token of its own.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Require a changeset
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "changeset-release/main" ]; then
            echo "Version Packages PR — changesets are consumed here, skipping."
            exit 0
          fi
          npx changeset status --since=origin/main

name: Release

# The filename stays "publish.yml" on purpose: the npmjs trusted-publisher (OIDC)
# binding is keyed to this repo + workflow *filename*. Renaming the file would
# require reconfiguring the trusted publisher on npmjs.com, so we keep the path
# even though the workflow now also opens the "Version Packages" PR.
#
# This is the recommended Changesets flow:
#   - push to main with pending changesets  -> open/update the "Version Packages" PR
#   - "Version Packages" PR merged (no changesets left) -> changeset publish (npm + tag)
#
# It runs under a GitHub App token (minted from secrets.APP_ID / APP_PRIVATE_KEY),
# not the default GITHUB_TOKEN, because (a) PRs opened by GITHUB_TOKEN do not trigger
# the required `test`/`changeset` checks (the "Version Packages" PR would be
# unmergeable); and (b) the App is a bypass actor on the release-tags ruleset, so it
# may push the protected release tag. The App is a distinct identity (app[bot]), so a
# human maintainer can approve the bot's "Version Packages" PR (no self-approval clash).

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version branch + release tag
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # OIDC trusted publishing — no NPM_TOKEN needed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: npm can publish with OIDC
        # OIDC needs npm >= 11.5.1. Node 24 ships it (24.22.0 has 11.19.1), so
        # nothing is installed here: an install outside the lockfile, in the job
        # that holds the publish identity, is what PO-298 removed.
        run: |
          v="$(npm -v)"
          printf '11.5.1\n%s\n' "$v" | sort -VC || { echo "npm $v is older than 11.5.1, which OIDC publishing needs" >&2; exit 1; }

      - run: npm ci

      # `files` is ["dist", "assets"], so an unbuilt tree publishes a tarball with
      # no dist at all — which is exactly how 0.2.0 shipped. The `prepublishOnly`
      # script is the real guard (it runs inside `changeset publish`); this step
      # surfaces a broken build here rather than mid-publish.
      - run: npm run build

      # Versioning ("changeset version") runs by default; publishing happens only
      # once the "Version Packages" PR is merged and no changesets remain.
      - name: Create release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run release
          github-token: ${{ steps.app-token.outputs.token }}
          # v2 flipped this default to false, which pushes the version commit and
          # the `v*` tag through the GitHub API instead of the Git CLI. Keep v1's
          # mechanism: the API path creates a lightweight ref at the merge commit
          # rather than pushing the annotated tag `changeset publish` builds locally,
          # and it swallows a rejected push into a warning — a ruleset that turned
          # the App down would leave the job green and the version untagged.
          push-with-git-cli: true
